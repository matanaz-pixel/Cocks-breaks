<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ניהול בנק טבחים</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="stylesheet" href="./theme.css">
<style>
  .add-form{ padding:14px; margin-bottom:24px; border-radius:var(--radius-lg); }
  .add-form label{ display:block; font-size:14px; font-weight:500; color:var(--text-dim); margin-bottom:8px; }
  .add-row{ display:flex; gap:8px; }
  .add-row input{
    flex:1; min-width:0; min-height:48px; background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:0 14px; color:var(--text); font-size:16px; outline:none;
  }
  .add-row input:focus{ border-color:var(--amber); }
  .add-row input::placeholder{ color:var(--text-faint); }
  .add-row .btn{ min-height:48px; }

  .search{
    width:100%; min-height:var(--tap); margin-bottom:12px;
    background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:0 14px; color:var(--text); font-size:15px; outline:none;
  }
  .search:focus{ border-color:var(--amber); }
  .search::placeholder{ color:var(--text-faint); }

  .bank-list{ display:flex; flex-direction:column; gap:10px; }
  .bank-row{ padding:12px; }
  .bank-top{ display:flex; align-items:center; gap:12px; }
  .bank-avatar{
    position:relative; flex:none; width:56px; height:56px; padding:0; border-radius:50%;
    background:var(--bg-2) center/cover no-repeat; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:19px; font-weight:600; color:var(--amber);
  }
  .cam-badge{
    position:absolute; bottom:-2px; left:-2px; width:24px; height:24px; border-radius:50%;
    background:var(--amber); color:var(--on-amber); border:2px solid var(--bg-0);
    display:flex; align-items:center; justify-content:center;
  }
  .cam-badge .icon{ width:13px; height:13px; stroke-width:2.4; }
  .bank-info{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
  .bank-name{ font-size:17px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }

  .bank-actions{ display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .bank-actions .btn{ flex:1; padding:0 10px; font-size:14px; }
  .bank-actions .btn-share{ color:var(--amber); border-color:var(--amber-dim); }
  .bank-actions .btn-icon{ flex:none; width:var(--tap); padding:0; }

  .share-box{
    display:flex; gap:8px; align-items:center; margin-top:10px;
    background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:6px 6px 6px 10px;
  }
  .share-box input{
    flex:1; min-width:0; background:transparent; border:none; color:var(--text-dim); font-size:13px; outline:none;
    direction:ltr; text-align:left;
  }
  .share-box .btn{ min-height:38px; padding:0 12px; font-size:14px; }
  .photo-input{ display:none; }
</style>
</head>
<body>

<div class="app">
  <a class="back-link" href="./index.html">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    חזרה למסך הראשי
  </a>

  <header class="topbar">
    <div class="topbar-title">
      <div class="eyebrow">רוברטה וינצ'י · כרכור</div>
      <h1>בנק טבחים</h1>
    </div>
  </header>

  <form class="add-form surface" id="addForm" autocomplete="off">
    <label for="chefNameInput">הוספת טבח חדש</label>
    <div class="add-row">
      <input id="chefNameInput" type="text" placeholder="שם מלא" enterkeyhint="done">
      <button id="addChefBtn" class="btn btn-primary" type="submit">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        הוסף
      </button>
    </div>
  </form>

  <h2 class="section-title">כל הטבחים <span class="count" id="bankCount"></span></h2>
  <input id="searchInput" class="search hidden" type="search" placeholder="חיפוש לפי שם..." aria-label="חיפוש טבח">
  <div id="emptyNote" class="empty-note hidden">הבנק ריק. הוסף טבח ראשון למעלה.</div>
  <div id="noResults" class="empty-note hidden">לא נמצא טבח בשם הזה</div>
  <div id="bankList" class="bank-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="./firebase-init.js"></script>
<script>
  const addForm = document.getElementById('addForm');
  const chefNameInput = document.getElementById('chefNameInput');
  const bankList = document.getElementById('bankList');
  const emptyNote = document.getElementById('emptyNote');
  const noResults = document.getElementById('noResults');
  const bankCount = document.getElementById('bankCount');
  const searchInput = document.getElementById('searchInput');

  const STATIONS = { tabun: 'טאבון', cold: 'פס קר', hot: 'פס חם', wash: 'שטיפה' };
  const ICONS = {
    camera: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
    link: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    trash: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    imageOff: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 2 20 20"/><path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/><path d="M13.5 13.5 6 21"/><path d="M18 12l3 3"/><path d="M3.59 3.59A2 2 0 0 0 3 5v14a2 2 0 0 0 2 2h14"/><path d="M21 15V5a2 2 0 0 0-2-2H9"/></svg>'
  };

  let bank = {};
  let breaksState = {};
  let openShareId = null;
  let query = '';

  function bankArr(){
    return Object.keys(bank).map(id => ({ id, ...bank[id] }))
      .sort((a,b) => a.name.localeCompare(b.name, 'he'));
  }
  function hasActiveBreak(id){ return !!breaksState[id]; }

  function esc(str){
    return String(str ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
  }

  function initials(name){
    const parts = name.trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2);
    return parts[0][0] + parts[1][0];
  }

  function resizeImageFile(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = reject;
        img.onload = ()=>{
          const size = Math.min(img.width, img.height);
          const sx = (img.width - size) / 2;
          const sy = (img.height - size) / 2;
          const OUT = 240;
          const canvas = document.createElement('canvas');
          canvas.width = OUT; canvas.height = OUT;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, sx, sy, size, size, 0, 0, OUT, OUT);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function triggerPhotoPick(id){
    const input = document.getElementById('photoInput-'+id);
    if(input) input.click();
  }

  async function onPhotoSelected(id, fileInput){
    const file = fileInput.files && fileInput.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImageFile(file);
      await db.ref('bank/'+id+'/photo').set(dataUrl);
    } catch(e){ /* קובץ לא תקין - מתעלמים בשקט */ }
    fileInput.value = '';
  }

  function removePhoto(id){
    db.ref('bank/'+id+'/photo').remove();
  }

  addForm.addEventListener('submit', (e)=>{ e.preventDefault(); addChef(); });
  searchInput.addEventListener('input', ()=>{ query = searchInput.value.trim(); render(); });

  function addChef(){
    const name = chefNameInput.value.trim();
    if(!name) { chefNameInput.focus(); return; }
    db.ref('bank').push({ name, station: '' });
    chefNameInput.value = '';
  }

  function deleteChef(id){
    if(hasActiveBreak(id)) return;
    const c = bank[id];
    if(!c || !confirm(`למחוק את ${c.name} מהבנק?\nההיסטוריה שלו/ה תישמר.`)) return;
    db.ref('bank/'+id).remove();
  }

  function toggleShare(id){
    openShareId = (openShareId === id) ? null : id;
    render();
  }

  function statusBadge(c){
    if(hasActiveBreak(c.id)) return '<span class="badge badge-run"><span class="dot"></span>בהפסקה כרגע</span>';
    if(c.station) return `<span class="badge badge-ok"><span class="dot"></span>${esc(STATIONS[c.station] || c.station)}</span>`;
    return '<span class="badge">לא במשמרת</span>';
  }

  function render(){
    const all = bankArr();
    const chefs = query ? all.filter(c => c.name.includes(query)) : all;
    bankList.innerHTML = '';
    emptyNote.classList.toggle('hidden', all.length > 0);
    noResults.classList.toggle('hidden', !(all.length > 0 && chefs.length === 0));
    searchInput.classList.toggle('hidden', all.length < 8);
    bankCount.textContent = all.length ? '· ' + all.length : '';

    chefs.forEach(c=>{
      const locked = hasActiveBreak(c.id);
      const row = document.createElement('article');
      row.className = 'bank-row surface';
      const avatarStyle = c.photo ? `style="background-image:url('${esc(c.photo)}')"` : '';
      const personalUrl = window.location.origin + window.location.pathname.replace('bank.html','chef.html') + '?id=' + encodeURIComponent(c.id);
      row.innerHTML = `
        <div class="bank-top">
          <button class="bank-avatar" type="button" data-pick-id="${c.id}" ${avatarStyle} aria-label="${c.photo ? 'החלף' : 'הוסף'} תמונה ל${esc(c.name)}">
            ${c.photo ? '' : esc(initials(c.name))}
            <span class="cam-badge">${ICONS.camera}</span>
          </button>
          <input type="file" id="photoInput-${c.id}" class="photo-input" accept="image/*">
          <div class="bank-info">
            <div class="bank-name">${esc(c.name)}</div>
            ${statusBadge(c)}
          </div>
        </div>
        <div class="bank-actions">
          <button class="btn btn-share" type="button" data-share-id="${c.id}" aria-expanded="${openShareId === c.id}">${ICONS.link}קישור אישי</button>
          ${c.photo ? `<button class="btn btn-ghost btn-icon" type="button" data-remove-photo-id="${c.id}" aria-label="הסר תמונה">${ICONS.imageOff}</button>` : ''}
          <button class="btn btn-ghost-danger btn-icon" type="button" data-delete-id="${c.id}" ${locked?'disabled title="אי אפשר למחוק באמצע הפסקה"':''} aria-label="מחק את ${esc(c.name)}">${ICONS.trash}</button>
        </div>
        ${openShareId === c.id ? `
          <div class="share-box">
            <input type="text" readonly value="${esc(personalUrl)}" aria-label="קישור אישי" onclick="this.select()">
            ${navigator.share ? `<button class="btn btn-primary" type="button" data-native-share="${c.id}">שתף</button>` : ''}
            <button class="btn" type="button" data-copy-id="${c.id}">העתק</button>
          </div>
        ` : ''}
      `;
      row.querySelectorAll('[data-copy-id],[data-native-share]').forEach(b => b.dataset.url = personalUrl);
      bankList.appendChild(row);
    });

    bankList.querySelectorAll('[data-delete-id]').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteChef(btn.dataset.deleteId));
    });
    bankList.querySelectorAll('[data-pick-id]').forEach(el=>{
      el.addEventListener('click', ()=> triggerPhotoPick(el.dataset.pickId));
    });
    bankList.querySelectorAll('[data-remove-photo-id]').forEach(btn=>{
      btn.addEventListener('click', ()=> removePhoto(btn.dataset.removePhotoId));
    });
    bankList.querySelectorAll('[data-share-id]').forEach(btn=>{
      btn.addEventListener('click', ()=> toggleShare(btn.dataset.shareId));
    });
    bankList.querySelectorAll('[data-native-share]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const c = bank[btn.dataset.nativeShare];
        navigator.share({ title: 'ההפסקה שלי', text: c ? `${c.name} - הקישור האישי להפסקות` : '', url: btn.dataset.url }).catch(()=>{});
      });
    });
    bankList.querySelectorAll('[data-copy-id]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        try{
          await navigator.clipboard.writeText(btn.dataset.url);
          btn.textContent = 'הועתק ✓';
          setTimeout(()=>{ btn.textContent = 'העתק'; }, 1500);
        } catch(e){ /* דפדפן ללא תמיכה בהעתקה - המשתמש יכול לסמן ולהעתיק ידנית */ }
      });
    });
    chefs.forEach(c=>{
      const input = document.getElementById('photoInput-'+c.id);
      if(input) input.addEventListener('change', ()=> onPhotoSelected(c.id, input));
    });
  }

  db.ref('bank').on('value', snap=>{ bank = snap.val() || {}; render(); });
  db.ref('breaks').on('value', snap=>{ breaksState = snap.val() || {}; render(); });
</script>

</body>
</html>
