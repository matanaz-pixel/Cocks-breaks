:root{--bg:#f6ecdf;--card:#fffaf3;--ink:#3b2c25;--muted:#6f5d52;--line:#e3d3bf;--clay:#a85a39;--clay-d:#8a4a2f;--sage:#4a6549;--warn:#9a5a18;--warn-bg:#f9e7c4;--ok-bg:#dcead8;--r:16px;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{direction:rtl;font-family:'Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-family:'Varela Round','Assistant',sans-serif;font-weight:400;font-size:1.25rem;margin-inline-end:auto;display:flex;gap:10px;align-items:center}
.top h1 i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--clay);color:#fff;font-style:normal;font-size:1rem}
.status{font-size:.9rem;color:var(--muted);min-width:9em;text-align:end}
.status.err{color:#9b2c1d;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:99px;border:2px solid var(--ink);background:transparent;cursor:pointer;font-weight:700;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--clay);border-color:var(--clay);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--clay-d);border-color:var(--clay-d)}
.btn.small{min-height:40px;padding:4px 14px;font-size:.95rem}
.btn.ghost{border-color:var(--line);font-weight:600}
.btn.danger:hover:not(:disabled){background:#9b2c1d;border-color:#9b2c1d}
/* layout */
.main{display:grid;grid-template-columns:minmax(360px,540px) 1fr;min-height:0}
.panel{overflow:auto;padding:18px 20px 80px;border-inline-end:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tab{min-height:44px;padding:6px 14px;border-radius:99px;border:2px solid transparent;background:var(--card);cursor:pointer;font-weight:600}
.tab:hover{background:#efdfcb}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);margin-inline-start:6px}
.panel h2{font-family:'Varela Round','Assistant',sans-serif;font-weight:400;font-size:1.5rem;margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:18px}
.notice{background:var(--warn-bg);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-size:.97rem}
.notice b{font-weight:700}
/* fields */
.group{background:var(--card);border-radius:var(--r);margin-bottom:12px;border:1px solid var(--line)}
.group>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:52px;border-radius:var(--r)}
.group>summary::-webkit-details-marker{display:none}
.group>summary::after{content:"▾";transition:transform .2s;color:var(--muted)}
.group[open]>summary::after{transform:rotate(180deg)}
.group .body{padding:4px 18px 18px;display:grid;gap:14px}
.field label,.field .lab{display:block;font-weight:700;margin-bottom:4px}
.field .hint{font-size:.88rem;color:var(--muted);margin-top:4px}
.field input[type=text],.field input[type=url],.field input[type=email],.field input[type=tel],.field textarea,.field select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;min-height:44px}
.field textarea{resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--clay);outline:none;box-shadow:0 0 0 3px rgba(168,90,57,.2)}
.field input.ltr{direction:ltr;text-align:left}
.field .count{font-size:.85rem;color:var(--muted);text-align:end}
.field .count.over{color:var(--warn);font-weight:700}
.ph-flag{display:inline-block;margin-inline-start:8px;font-size:.78rem;font-weight:700;background:var(--warn-bg);color:var(--warn);padding:1px 10px;border-radius:99px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--clay);flex:none}
/* lists */
.list{display:grid;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.item .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.item .row b{font-size:.92rem;color:var(--muted)}
.ctl{display:flex;gap:4px}
.ctl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1rem;line-height:1}
.ctl button:hover:not(:disabled){background:var(--ink);color:#fff}
.ctl button:disabled{opacity:.35;cursor:not-allowed}
.ctl .del:hover:not(:disabled){background:#9b2c1d}
.strrow{display:flex;gap:6px;align-items:flex-start}
.strrow .field{flex:1}
/* images */
.img-slot{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:120px 1fr;gap:14px}
.thumb{width:120px;height:120px;border-radius:14px;background:#efdfcb;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.85rem;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.img-slot .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.img-slot h3{font-size:1.05rem}
.img-slot input[type=file]{display:none}
/* publish */
.issues{list-style:none;display:grid;gap:8px;margin:10px 0 18px}
.issues li{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.issues .must{border-inline-start:6px solid #b3402d}
.issues .should{border-inline-start:6px solid var(--warn)}
.allgood{background:var(--ok-bg);border-radius:var(--r);padding:14px 18px;font-weight:700;margin:10px 0 18px}
.steps{counter-reset:s;list-style:none;display:grid;gap:12px;margin:12px 0}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.steps li ul{margin:6px 18px 0 0;color:var(--muted);font-size:.95rem}
code{background:#efdfcb;padding:1px 6px;border-radius:6px;direction:ltr;unicode-bidi:embed}
/* preview */
.preview{display:grid;grid-template-rows:auto 1fr;min-height:0;background:#e9dcc9}
.pv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.pv-bar .sp{margin-inline-start:auto;display:flex;gap:6px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.seg button{border:0;background:transparent;min-height:40px;padding:4px 14px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.stage{display:grid;place-items:stretch;min-height:0;padding:12px;overflow:auto}
.frame-wrap{margin:0 auto;width:100%;height:100%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(59,44,37,.2)}
.frame-wrap.mobile{width:390px;max-width:100%}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.mode-switch{display:none}
/* dialog */
dialog{border:0;border-radius:22px;padding:26px 28px;max-width:560px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(59,44,37,.55)}
dialog h2{font-family:'Varela Round','Assistant',sans-serif;font-weight:400;margin-bottom:10px}
dialog .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;justify-content:flex-start}
.toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:24px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
[hidden]{display:none!important}
@media (max-width:1000px){
 body{overflow:auto}
 .app{height:auto;min-height:100%;grid-template-rows:auto auto}
 .main{grid-template-columns:1fr;display:block}
 .panel{overflow:visible;border:0;padding-bottom:110px}
 .preview{height:calc(100vh - 150px);min-height:480px}
 .main[data-mode="edit"] .preview{display:none}
 .main[data-mode="view"] .panel{display:none}
 .mode-switch{display:flex;position:fixed;bottom:14px;inset-inline-start:50%;transform:translateX(50%);z-index:40;background:var(--card);border-radius:99px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
 .toast{bottom:84px}
}
@media (max-width:560px){.img-slot{grid-template-columns:1fr}.status{display:none}}
#content>.field{margin-bottom:14px}
#content>.group+.group{margin-top:0}

</style>
</head>
<body>
<div class="app">
 <header class="top">
  <h1><i aria-hidden="true">☾</i>עורך האתר</h1>
  <span class="status" id="status" role="status" aria-live="polite">טוען…</span>
  <button class="btn small ghost" id="btnUndo" type="button" disabled>ביטול פעולה אחרונה</button>
  <button class="btn small ghost" id="btnBackup" type="button">שמירת גיבוי</button>
  <button class="btn small ghost" id="btnRestore" type="button">פתיחת גיבוי</button>
  <button class="btn small primary" id="btnPublish" type="button">הכנה לפרסום</button>
  <input type="file" id="fileRestore" accept=".json,application/json" hidden>
 </header>
 <div class="main" id="main" data-mode="edit">
  <section class="panel" id="panel" aria-label="עריכה">
   <div class="tabs" id="tabs" role="tablist" aria-label="חלקי האתר"></div>
   <div id="content"></div>
  </section>
  <section class="preview" aria-label="תצוגה מקדימה">
   <div class="pv-bar">
    <div class="seg" id="pvPages" role="group" aria-label="עמוד לתצוגה"></div>
    <div class="sp"><div class="seg" role="group" aria-label="גודל מסך"><button type="button" id="pvDesktop" aria-pressed="true">מחשב</button><button type="button" id="pvMobile" aria-pressed="false">טלפון</button></div></div>
   </div>
   <div class="stage"><div class="frame-wrap" id="frameWrap"><iframe id="frame" title="תצוגה מקדימה של האתר" sandbox="allow-scripts allow-popups"></iframe></div></div>
  </section>
 </div>
</div>
<div class="seg mode-switch" id="modeSwitch" role="group" aria-label="מעבר בין עריכה לתצוגה"><button type="button" data-m="edit" aria-pressed="true">עריכה</button><button type="button" data-m="view" aria-pressed="false">תצוגה</button></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>
<script>
/* מחולל האתר. רץ גם בדפדפן (בתוך העורך) וגם ב-Node (לבדיקות ולבנייה משורת פקודה).
 * generate(project, assets, opts) -> { files: [{path, text} | {path, base64}], issues }
 *   project: { biz, home, services, images }
 *   assets:  { css, fonts, sprite }
 *   opts:    { preview: boolean }   תצוגה מקדימה: תמונות מוטמעות, קישורים בין עמודים נתפסים על ידי העורך
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SiteGen = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var ICON_NAMES = ['heart', 'sparkle', 'moon', 'people', 'clock', 'leaf', 'chat', 'book', 'phone', 'sprout', 'blocks', 'baby', 'wallet', 'shield', 'sun', 'star', 'check'];
  var PLACEHOLDERS = { name: 'שם היועצת', phone: '050-000-0000', emailDomain: 'example.com', instagram: 'https://instagram.com/', facebook: 'https://facebook.com/' };
  var IMAGE_SLOTS = [
    { key: 'hero', label: 'תמונה ראשית בדף הבית', hint: 'תמונה שלך או של הילדים, בצורת קשת. עדיף תמונה אנכית.' },
    { key: 'about', label: 'תמונה אישית (נעים להכיר)', hint: 'תמונה שלך, עדיף פנים ברורות ורקע פשוט.' },
    { key: 'newborn', label: 'תמונה לעמוד הדרכת ניובורן', hint: '' },
    { key: 'sleep', label: 'תמונה לעמוד ייעוץ שינה', hint: '' },
    { key: 'toddlers', label: 'תמונה לעמוד הדרכת פעוטות', hint: '' },
    { key: 'development', label: 'תמונה לעמוד ליווי התפתחותי', hint: '' }
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function ml(s) { return esc(s).replace(/ *\r?\n */g, ' <br>'); }
  function arr(a) { return Array.isArray(a) ? a : []; }

  /* 050-123-4567 / +972 50 123 4567 -> 972501234567 */
  function normalizePhone(p) {
    var d = String(p || '').replace(/[^\d+]/g, '');
    if (d.charAt(0) === '+') d = d.slice(1);
    d = d.replace(/\D/g, '');
    if (d.indexOf('972') === 0) return d;
    if (d.charAt(0) === '0') return '972' + d.slice(1);
    return d;
  }
  function fixUrl(u) {
    u = String(u || '').trim();
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    return 'https://' + u.replace(/^\/+/, '');
  }
  function siteBase(u) {
    u = fixUrl(u);
    return u ? u.replace(/\/+$/, '') : '';
  }

  function icon(n) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + esc(n) + '"/></svg>'; }

  /* ---------- בדיקת פריטים שעדיין לא הוחלפו ---------- */
  function findIssues(p) {
    var out = [], b = p.biz || {}, imgs = p.images || {};
    function add(level, text, tab) { out.push({ level: level, text: text, tab: tab }); }
    if (!b.name || b.name === PLACEHOLDERS.name) add('must', 'השם עדיין "' + PLACEHOLDERS.name + '"', 'contact');
    var ph = normalizePhone(b.phone);
    if (!b.phone || b.phone === PLACEHOLDERS.phone || ph.length < 11 || ph.length > 12) add('must', 'מספר הטלפון והוואטסאפ עדיין לא תקין או לא הוחלף', 'contact');
    if (!b.email || /example\.com/i.test(b.email) || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(b.email)) add('must', 'כתובת האימייל עדיין לא הוחלפה או אינה תקינה', 'contact');
    if (!b.instagram || fixUrl(b.instagram) === PLACEHOLDERS.instagram) add('should', 'קישור האינסטגרם עדיין כללי', 'contact');
    if (!b.facebook || fixUrl(b.facebook) === PLACEHOLDERS.facebook) add('should', 'קישור הפייסבוק עדיין כללי', 'contact');
    var samples = 0;
    arr(p.services).forEach(function (s) { arr(s.testimonials).forEach(function (t) { if (t.sample) samples++; }); });
    if (samples) add('must', samples + ' המלצות עדיין מסומנות כ"דוגמה". יש להחליף אותן בהמלצות אמיתיות או למחוק', 'reviews');
    IMAGE_SLOTS.forEach(function (s) { if (!imgs[s.key] || !imgs[s.key].data) add('should', 'חסרה ' + s.label, 'images'); });
    Object.keys(imgs).forEach(function (k) { var i = imgs[k]; if (i && i.data && !String(i.alt || '').trim() && k !== 'og') add('should', 'חסר תיאור קצר לתמונה "' + k + '" (נחוץ לנגישות)', 'images'); });
    if (!b.siteUrl) add('should', 'עדיין לא הוזנה כתובת האתר. בלעדיה לא ייווצרו מפת אתר ותמונת שיתוף', 'contact');
    return out;
  }

  /* ---------- יצירת האתר ---------- */
  function generate(project, assets, opts) {
    opts = opts || {};
    var B = project.biz || {}, H = project.home || {}, SV = arr(project.services), IM = project.images || {};
    var phoneIntl = normalizePhone(B.phone);
    var base = siteBase(B.siteUrl);
    var preview = !!opts.preview;
    var SVM = {};
    SV.forEach(function (s) { SVM[s.slug] = s; });

    function wa(text) { return 'https://wa.me/' + phoneIntl + '?text=' + encodeURIComponent(text || ''); }

    /* תמונות */
    function hasImg(key) { return !!(IM[key] && IM[key].data); }
    function imgFile(key) { return 'images/' + key + '.jpg'; }
    function imgTag(key) {
      if (!hasImg(key)) return '';
      var i = IM[key], pos = { top: '50% 20%', center: '50% 50%', bottom: '50% 80%' }[i.focus] || '50% 50%';
      return '<img class="ph" src="' + (preview ? i.data : imgFile(key)) + '" alt="' + esc(i.alt || '') + '"' +
        (i.w && i.h ? ' width="' + (i.w | 0) + '" height="' + (i.h | 0) + '"' : '') + ' style="object-position:' + pos + '"' +
        (key === 'hero' ? '' : ' loading="lazy"') + ' decoding="async">';
    }

    /* מבנה משותף */
    function nav(h, hasReviews) {
      var n = [['שירותים', h + '#services'], ['הגישה ההוליסטית', h + '#holistic'], ['עליי', h + '#about']];
      if (hasReviews) n.push(['המלצות', '#reviews']);
      n.push(['מימון', '#funding'], ['שאלות', '#faq']);
      return n;
    }
    function pageShell(o) {
      var navHtml = o.nav.map(function (x) { return '<li><a href="' + esc(x[1]) + '">' + esc(x[0]) + '</a></li>'; }).join('\n    ');
      var bodyStyle = o.S ? ' style="--accent:' + esc(o.S.accent) + ';--pastel:' + esc(o.S.pastel) + '"' : '';
      var ldJson = JSON.stringify(o.ld).replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026');
      var canon = o.canonical ? '<link rel="canonical" href="' + esc(o.canonical) + '">\n<meta property="og:url" content="' + esc(o.canonical) + '">\n' : '';
      var og = (base && hasImg('og')) ? '<meta property="og:image" content="' + esc(base + '/images/og.jpg') + '">\n<meta name="twitter:card" content="summary_large_image">\n' : '';
      var footerSv = SV.map(function (s) { return '<li><a href="' + esc(s.file) + '">' + esc(s.short) + '</a></li>'; }).join('');
      var h = o.h;
      var previewScript = preview ? '<script>(function(){var t;addEventListener("scroll",function(){clearTimeout(t);t=setTimeout(function(){parent.postMessage({siteScroll:scrollY},"*")},80)},{passive:true});' +
        'addEventListener("message",function(e){if(e.data&&e.data.restoreScroll!=null){var d=document.documentElement;d.style.scrollBehavior="auto";scrollTo(0,e.data.restoreScroll);d.style.scrollBehavior=""}});' +
        'document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(!a)return;var h=a.getAttribute("href")||"";if(/\\.html(#|$)/.test(h)){e.preventDefault();parent.postMessage({siteNav:h},"*")}});' +
        'parent.postMessage({siteReady:true},"*")})()<\/script>' : '';
      return '<!doctype html>\n<html lang="he" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
        '<title>' + esc(o.title) + '</title>\n<meta name="description" content="' + esc(o.desc) + '">\n<meta name="theme-color" content="#f6ecdf">\n' +
        '<meta property="og:title" content="' + esc(o.title) + '">\n<meta property="og:description" content="' + esc(o.desc) + '">\n<meta property="og:type" content="website">\n<meta property="og:locale" content="he_IL">\n' + canon + og +
        '<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 64 64\'%3E%3Crect width=\'64\' height=\'64\' rx=\'32\' fill=\'%23a85a39\'/%3E%3Cpath d=\'M44 36.5A14 14 0 1 1 28.6 19.8a11 11 0 0 0 15.4 16.7z\' fill=\'%23fffaf3\'/%3E%3C/svg%3E">\n' +
        '<script type="application/ld+json">' + ldJson + '<\/script>\n<script>document.documentElement.classList.add(\'js\')<\/script>\n<style>\n' + assets.fonts + '\n' + assets.css + '\n</style>\n</head>\n<body' + bodyStyle + '>\n' +
        '<a class="skip" href="#main">דלגו לתוכן</a>\n' + assets.sprite + '\n<header>\n <div class="wrap nav">\n  <a class="brand" href="' + (h || '#top') + '"><i>' + icon('moon') + '</i>' + esc(B.name) + '</a>\n' +
        '  <button class="burger" id="burger" type="button" aria-label="פתיחת תפריט" aria-expanded="false" aria-controls="menu">' + icon('menu') + '</button>\n' +
        '  <nav aria-label="ראשי">\n   <ul class="menu" id="menu">\n    ' + navHtml + '\n    <li><a href="' + esc(o.pageWa) + '" target="_blank" rel="noopener">בואו נדבר</a></li>\n   </ul>\n  </nav>\n </div>\n</header>\n' +
        '<main id="main">\n' + o.main + '\n</main>\n' +
        '<a class="fab" id="fab" href="' + esc(o.pageWa) + '" target="_blank" rel="noopener" aria-label="שלחו הודעה בוואטסאפ">' + icon('whatsapp') + '</a>\n' +
        '<footer class="site"><div class="wrap">\n <div class="f-grid">\n  <div><h2>' + esc(B.name) + '</h2><p>' + esc(B.role) + '</p></div>\n  <div><h2>שירותים</h2><ul>' + footerSv + '</ul></div>\n' +
        '  <div><h2>קישורים</h2><ul><li><a href="index.html">דף הבית</a></li><li><a href="' + h + '#holistic">הגישה ההוליסטית</a></li><li><a href="' + h + '#about">עליי</a></li><li><a href="' + h + '#funding">השתתפות כספית</a></li></ul></div>\n </div>\n' +
        ' <p class="f-note">© ' + esc(B.name) + ' · ' + esc(B.disclaimer) + '</p>\n</div></footer>\n' + previewScript + '\n<script>\n' + SHARED_JS + '\n<\/script>\n</body>\n</html>\n';
    }

    var SHARED_JS = "(function(){\nvar b=document.getElementById('burger'),m=document.getElementById('menu');\n" +
      "function set(o){m.classList.toggle('open',o);b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'סגירת תפריט':'פתיחת תפריט')}\n" +
      "b.addEventListener('click',function(){set(!m.classList.contains('open'))});\n" +
      "m.addEventListener('click',function(e){if(e.target.closest('a'))set(false)});\n" +
      "document.querySelector('.brand').addEventListener('click',function(){set(false)});\n" +
      "document.addEventListener('keydown',function(e){if(e.key==='Escape'&&m.classList.contains('open')){set(false);b.focus()}});\n" +
      "if(window.matchMedia){var mq=window.matchMedia('(min-width:761px)');var fn=function(e){if(e.matches)set(false)};mq.addEventListener?mq.addEventListener('change',fn):mq.addListener(fn)}\n" +
      "var f=document.getElementById('fab'),ct=document.getElementById('contact'),inC=false;\n" +
      "function fab(){f.classList.toggle('show',window.scrollY>480&&!inC)}\n" +
      "if('IntersectionObserver' in window&&ct){new IntersectionObserver(function(es){inC=es[0].isIntersecting;fab()},{threshold:.15}).observe(ct)}\n" +
      "window.addEventListener('scroll',fab,{passive:true});fab();\n})();";

    /* רכיבים משותפים */
    function faq(items) {
      items = arr(items);
      if (!items.length) return '';
      return '<div class="faq">' + items.map(function (f) {
        return '\n <details><summary>' + esc(f.q) + icon('chev') + '</summary><p>' + esc(f.a) + '</p></details>';
      }).join('') + '\n</div>';
    }
    function review(t, badge) {
      return '<figure class="review">' + icon('quote') + '<blockquote><p>' + esc(t.text) + '</p></blockquote>\n <figcaption class="who"><span>' + esc(t.who) + '</span>' +
        (badge ? '<span class="badge" style="--c:' + esc(badge.pastel) + '">' + esc(badge.short) + '</span>' : '') +
        (t.sample ? '<span class="sample-tag">דוגמה</span>' : '') + '</figcaption></figure>';
    }
    function funding(compact, pageWa) {
      var cards = arr(H.funding_cards), steps = arr(H.funding_steps);
      var s = '<section id="funding" class="funding' + (compact ? ' compact' : '') + '"' + (compact ? ' style="padding-top:30px"' : '') + '><div class="wrap"><div class="box">\n' +
        ' <div class="head"><span class="tag">השתתפות כספית</span><h2>' + esc(H.funding_title) + '</h2><p>' + esc(H.funding_intro) + '</p></div>\n';
      if (!compact && cards.length) s += ' <div class="fcards">' + cards.map(function (c) {
        return '\n  <div class="fcard"><div class="ico">' + icon(c.icon) + '</div><div><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p></div></div>';
      }).join('') + '\n </div>\n';
      if (steps.length) s += ' <ol class="fsteps">' + steps.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>\n';
      s += ' <p class="fnote">' + esc(H.funding_note) + (compact ? ' <a href="index.html#funding">לפרטים נוספים</a>' : '') + '</p>\n' +
        ' <div class="actions" style="justify-content:center;margin-top:22px"><a class="btn" href="' + esc(pageWa) + '" target="_blank" rel="noopener">' + icon('whatsapp') + 'לבדוק זכאות בשיחת היכרות</a></div>\n</div></div></section>';
      return s;
    }
    function contact(title, sub, chips, pageWa) {
      var s = '<section id="contact" class="contact" style="padding-top:30px"><div class="wrap"><div class="box-dark">\n <h2>' + esc(title) + '</h2>\n <p class="lead">' + esc(sub) + '</p>\n';
      chips = arr(chips);
      if (chips.length) s += ' <p class="pick">' + esc(H.contact_pick) + '</p>\n <ul class="wa-chips">' + chips.map(function (c) {
        return '<li><a href="' + esc(wa(c.text)) + '" target="_blank" rel="noopener">' + icon('whatsapp') + esc(c.label) + '</a></li>';
      }).join('') + '</ul>\n';
      else s += ' <div class="row2"><a class="btn light" href="' + esc(pageWa) + '" target="_blank" rel="noopener">' + icon('whatsapp') + 'שלחו הודעה בוואטסאפ</a></div>\n';
      s += ' <div class="row2"><a class="btn ghost-w" href="tel:+' + phoneIntl + '">' + icon('phone') + esc(B.phone) + '</a></div>\n' +
        ' <a class="mail" href="mailto:' + esc(B.email) + '">' + icon('mail') + esc(B.email) + '</a>\n <div class="social">\n';
      if (fixUrl(B.instagram)) s += '  <a href="' + esc(fixUrl(B.instagram)) + '" target="_blank" rel="noopener" aria-label="אינסטגרם">' + icon('instagram') + '</a>\n';
      if (fixUrl(B.facebook)) s += '  <a href="' + esc(fixUrl(B.facebook)) + '" target="_blank" rel="noopener" aria-label="פייסבוק">' + icon('facebook') + '</a>\n';
      return s + ' </div>\n</div></div></section>';
    }
    function photoInner(key, iconName, caption) {
      return hasImg(key) ? imgTag(key) : icon(iconName) + '<small>' + esc(caption) + '</small>';
    }
    function sectionHead(tag, title, intro) {
      return '<div class="head">' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + '<h2>' + esc(title) + '</h2>' + (intro ? '<p>' + esc(intro) + '</p>' : '') + '</div>';
    }
    function cards4(items) {
      return '<div class="cards4">' + arr(items).map(function (p) {
        return '\n  <div class="card"><div class="ico">' + icon(p.icon) + '</div><h3>' + esc(p.title) + '</h3><p>' + esc(p.text) + '</p></div>';
      }).join('') + '\n </div>';
    }

    /* ---------- דף הבית ---------- */
    function homePage() {
      var pageWa = wa(H.wa_text);
      var homeReviews = [];
      SV.forEach(function (s) { arr(s.testimonials).forEach(function (t) { if (t.home) homeReviews.push([t, s]); }); });
      var aboutParas = arr(H.about).map(function (x) { return String(x).replace(/\{name\}/g, B.name); });
      var m = '';
      m += '<div class="hero" id="top"><div class="wrap">\n <div>\n  <span class="eyebrow">' + esc(H.hero_eyebrow) + '</span>\n  <h1>' + ml(H.hero_title) + '</h1>\n  <p class="sub">' + esc(H.hero_sub) + '</p>\n' +
        '  <div class="actions">\n   <a class="btn" href="' + esc(pageWa) + '" target="_blank" rel="noopener">' + icon('whatsapp') + 'בואו נדבר בוואטסאפ</a>\n   <a class="btn line" href="#services">לכל השירותים</a>\n  </div>\n' +

  /* ---------- פרסום ---------- */

        h('li', {}, h('div', {}, 'פתחי את האתר החי בטלפון ובדקי שהכול נראה כמו בתצוגה המקדימה. כל עדכון עתידי הוא אותם שלושה שלבים.'))),

      h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' }, h('button', { type: 'button', class: 'btn', onclick: backup }, 'שמירת גיבוי עכשיו')));
    return out;
  }

  /* ---------- ZIP ---------- */
  var CRC = (function () { var t = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { var c = 0xFFFFFFFF; for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

      parts.push(head, name, data);
      central.push(new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(dt), u16(dd), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset))), name);

  function downloadSite() {
    var issues = Gen.findIssues(P), must = issues.filter(function (i) { return i.level === 'must'; });

    var needOg = Gen.fixUrl(P.biz.siteUrl) && P.images.hero && P.images.hero.data;
    Promise.resolve(needOg ? makeOg(P.images.hero.data) : null).then(function (og) {

  }

  /* ---------- גיבוי ושחזור ---------- */
  function backup() {
    var blob = new Blob([JSON.stringify({ app: 'site-editor', version: 1, savedAt: new Date().toISOString(), project: P })], { type: 'application/json' });
    download(blob, 'site-backup-' + dateStamp(new Date()) + '.json');
    DB.set('lastBackup', Date.now()).catch(function () { });
    toast('קובץ הגיבוי ירד. שמרי אותו במקום בטוח.');
  }
  function restore(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(r.result);
        if (!o || o.app !== 'site-editor' || !o.project || !Array.isArray(o.project.services)) throw new Error('bad');
        if (!window.confirm('פתיחת הגיבוי תחליף את מה שיש עכשיו בעורך. אפשר יהיה לבטל בכפתור "ביטול פעולה אחרונה". להמשיך?')) return;
        pushUndo(); P = mergeProject(DEFAULTS, o.project); renderAll(); changed(); toast('הגיבוי נפתח');
      } catch (e) { toast('זה לא קובץ גיבוי של העורך'); }
    };
    r.readAsText(file);
  }

  /* ---------- תצוגה מקדימה ---------- */

    try {
      var res = Gen.generate(P, ASSETS, { preview: true });
      var f = res.files.filter(function (x) { return x.path === pvPage; })[0] || res.files[0];
      $('frame').srcdoc = f.text;

      box.append(h('button', { type: 'button', 'aria-pressed': p.file === pvPage ? 'true' : 'false', onclick: function () { pvPage = p.file; renderPvPages(); renderPreview(); } }, p.label));
    });
  }

    }
  });

  /* ---------- ציור ---------- */
