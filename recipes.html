<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ספר מתכונים</title>
<meta name="theme-color" content="#2a2019">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap');

  :root{
    --steel-0:#1f1712; --steel-1:#2a2019; --steel-2:#34281f;
    --line:#4a3a2c; --amber:#d1642f; --amber-dim:#7a3d20;
    --text:#f3ece0; --text-dim:#b8a58f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:radial-gradient(circle at 50% -10%, #2f2418 0%, var(--steel-0) 55%);
    color:var(--text); font-family:'Rubik',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  body{ display:flex; justify-content:center; padding:24px 16px 60px; }
  .app{ width:100%; max-width:560px; }
  h1{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:27px; margin:0 0 16px; text-align:center; }

  .search{
    width:100%; background:var(--steel-1); border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:13px 14px; font-size:16px; font-family:inherit; margin-bottom:14px;
  }
  .search:focus{ outline:none; border-color:var(--amber); }

  .tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; background:var(--steel-1); border:1px solid var(--line); color:var(--text-dim);
    border-radius:20px; padding:9px 16px; font-size:14px; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .tab.active{ background:var(--amber); border-color:var(--amber); color:#fff; font-weight:600; }

  .card{ background:var(--steel-1); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .card-head{
    width:100%; background:none; border:none; color:var(--text); font-family:inherit; font-size:17px;
    text-align:right; padding:15px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .card-head .cat{ font-size:11px; color:var(--amber); }
  .chev{ color:var(--text-dim); transition:transform .2s; }
  .card.open .chev{ transform:rotate(180deg); }
  .card-body{ display:none; padding:0 16px 16px; border-top:1px solid var(--line); }
  .card.open .card-body{ display:block; }
  .card-body h3{ font-size:12px; color:var(--text-dim); letter-spacing:.1em; margin:14px 0 6px; }
  .card-body ul, .card-body ol{ margin:0; padding-inline-start:20px; line-height:1.7; font-size:15px; }
  .note{ margin-top:12px; font-size:13px; color:var(--text-dim); }

  .empty-note, .status{ text-align:center; color:var(--text-dim); font-size:14px; padding:26px 10px; border:1px dashed var(--line); border-radius:14px; }
  .status.error{ color:#e8a090; border-color:#6b2318; }
</style>
</head>
<body>
<div class="app">
  <h1>ספר מתכונים</h1>
  <input class="search" id="search" type="search" placeholder="חיפוש מתכון או מצרך..." autocomplete="off">
  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="status">טוען מתכונים...</div></div>
</div>

<script>
// כתובת ה-CSV של הגיליון המפורסם (קובץ > שיתוף > פרסום באינטרנט > CSV).
// כל עוד השדה ריק, הדף קורא את recipes.csv מהריפו.
const SHEET_CSV_URL = '';
const CATEGORIES = ['פס קר', 'פס חם', 'טאבון', "צ'קר", 'קונדיטוריה'];

let recipes = [];
let activeTab = 'הכל';

function parseCSV(text){
  const rows = []; let row = [], cell = '', quoted = false;
  text = text.replace(/^﻿/, '');
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(quoted){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else quoted = false; }
      else cell += c;
    } else if(c === '"') quoted = true;
    else if(c === ','){ row.push(cell); cell = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); cell = '';
      if(row.some(x => x.trim() !== '')) rows.push(row);
      row = [];
    } else cell += c;
  }
  row.push(cell);
  if(row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}

function lines(s){ return (s || '').split('\n').map(x => x.trim()).filter(Boolean); }

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

async function load(){
  const list = document.getElementById('list');
  try{
    const res = await fetch(SHEET_CSV_URL || './recipes.csv', { cache: 'no-store' });
    if(!res.ok) throw new Error(res.status);
    const rows = parseCSV(await res.text()).slice(1);
    recipes = rows.map(r => ({
      cat: (r[0] || '').trim(), title: (r[1] || '').trim(),
      ingredients: lines(r[2]), steps: lines(r[3]), note: (r[4] || '').trim()
    })).filter(r => r.title);
    buildTabs();
    render();
  }catch(e){
    list.replaceChildren(el('div', 'status error', 'לא הצלחתי לטעון את המתכונים. נסו לרענן.'));
  }
}

function buildTabs(){
  const tabs = document.getElementById('tabs');
  const extra = [...new Set(recipes.map(r => r.cat))].filter(c => c && !CATEGORIES.includes(c));
  tabs.replaceChildren(...['הכל', ...CATEGORIES, ...extra].map(name => {
    const b = el('button', 'tab' + (name === activeTab ? ' active' : ''), name);
    b.onclick = () => { activeTab = name; buildTabs(); render(); };
    return b;
  }));
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const shown = recipes.filter(r =>
    (activeTab === 'הכל' || r.cat === activeTab) &&
    (!q || [r.title, r.cat, r.ingredients.join(' '), r.steps.join(' ')].join(' ').toLowerCase().includes(q))
  );
  const list = document.getElementById('list');
  if(!shown.length){ list.replaceChildren(el('div', 'empty-note', 'לא נמצאו מתכונים')); return; }
  list.replaceChildren(...shown.map(r => {
    const card = el('div', 'card');
    const head = el('button', 'card-head');
    const t = el('span'); t.append(el('div', '', r.title), el('div', 'cat', r.cat));
    head.append(t, el('span', 'chev', '▾'));
    head.onclick = () => card.classList.toggle('open');
    const body = el('div', 'card-body');
    if(r.ingredients.length){
      const ul = el('ul'); r.ingredients.forEach(i => ul.append(el('li', '', i)));
      body.append(el('h3', '', 'מצרכים'), ul);
    }
    if(r.steps.length){
      const ol = el('ol'); r.steps.forEach(s => ol.append(el('li', '', s)));
      body.append(el('h3', '', 'הכנה'), ol);
    }
    if(r.note) body.append(el('div', 'note', r.note));
    card.append(head, body);
    return card;
  }));
}

document.getElementById('search').addEventListener('input', render);
load();
</script>
</body>
</html>
