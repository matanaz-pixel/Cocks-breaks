<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>היסטוריית הפסקות</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="stylesheet" href="./theme.css">
<style>
  .profile{ display:flex; align-items:center; gap:14px; padding:16px; margin-bottom:16px; border-radius:var(--radius-lg); position:relative; overflow:hidden; }
  .profile::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,transparent,var(--amber),transparent); opacity:.7;
  }
  .profile .avatar{ width:64px; height:64px; font-size:21px; }
  .profile-name{ font-family:'Frank Ruhl Libre',serif; font-size:23px; font-weight:700; line-height:1.2; margin-bottom:4px; }

  .summary-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:24px; }
  .summary-card{ background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius); padding:12px 8px; text-align:center; }
  .summary-num{ font-family:'Oswald',sans-serif; font-size:24px; font-weight:600; line-height:1.1; color:var(--amber); }
  .summary-card.late .summary-num{ color:var(--danger-text); }
  .summary-label{ font-size:12px; color:var(--text-dim); margin-top:4px; }

  .entries{ display:flex; flex-direction:column; gap:8px; }
  .entry{ display:flex; align-items:center; gap:12px; padding:12px; }
  .entry.cancelled{ opacity:.7; }
  .entry-date{ flex:none; width:48px; text-align:center; padding:6px 0; border-radius:var(--radius-sm); background:var(--bg-2); }
  .entry-day{ font-family:'Oswald',sans-serif; font-size:19px; font-weight:600; line-height:1.1; }
  .entry-month{ font-size:12px; color:var(--text-dim); }
  .entry-body{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:5px; }
  .entry-title{ font-size:15px; font-weight:500; }
  .entry-time{ flex:none; font-size:14px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<div class="app">
  <a class="back-link" href="./index.html">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    חזרה למסך הראשי
  </a>

  <div id="profile" class="profile surface"></div>

  <div class="summary-row" id="summaryRow"></div>

  <h2 class="section-title">היסטוריית הפסקות</h2>
  <div id="emptyNote" class="empty-note hidden">אין עדיין היסטוריה לטבח הזה</div>
  <div id="entries" class="entries"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="./firebase-init.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const chefId = params.get('id');

  function esc(str){
    return String(str ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
  }

  function initials(name){
    const parts = name.trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2);
    return parts[0][0] + parts[1][0];
  }

  const STATIONS = { tabun: 'טאבון', cold: 'פס קר', hot: 'פס חם', wash: 'שטיפה' };
  function stationLabel(key){ return key ? (STATIONS[key] || key) : 'לא במשמרת היום'; }

  Promise.all([
    db.ref('bank/'+chefId).once('value'),
    db.ref('history').once('value')
  ]).then(([bankSnap, historySnap])=>{
    const chef = bankSnap.val();
    const historyObj = historySnap.val() || {};
    const allHistory = Object.values(historyObj);
    const chefEntries = allHistory
      .filter(h => h.chefId === chefId)
      .sort((a,b) => b.finishedAt - a.finishedAt);

    const chefName = chef ? chef.name : (chefEntries[0] ? chefEntries[0].chefName : 'טבח');

    const profileEl = document.getElementById('profile');
    profileEl.innerHTML = `
      <div class="avatar">${chef && chef.photo ? `<img src="${esc(chef.photo)}" alt="">` : esc(initials(chefName))}</div>
      <div>
        <div class="profile-name">${esc(chefName)}</div>
        <span class="badge ${chef && chef.station ? 'badge-ok' : ''}">${chef ? esc(stationLabel(chef.station)) : 'הוסר מהבנק'}</span>
      </div>
    `;

    const completed = chefEntries.filter(h => h.status === 'completed');
    const totalBreaks = chefEntries.length;
    const totalOvertimeSec = completed.reduce((sum,h)=> sum + (h.overtimeSeconds||0), 0);
    const overtimeCount = completed.filter(h => (h.overtimeSeconds||0) > 0).length;

    const summaryRow = document.getElementById('summaryRow');
    function fmtMinutes(totalSec){ return Math.round(totalSec/60) + " דק'"; }
    summaryRow.innerHTML = `
      <div class="summary-card"><div class="summary-num">${totalBreaks}</div><div class="summary-label">סה"כ הפסקות</div></div>
      <div class="summary-card late"><div class="summary-num">${overtimeCount}</div><div class="summary-label">עם חריגה</div></div>
      <div class="summary-card late"><div class="summary-num">${fmtMinutes(totalOvertimeSec)}</div><div class="summary-label">חריגה מצטברת</div></div>
    `;

    const entriesEl = document.getElementById('entries');
    const emptyNote = document.getElementById('emptyNote');

    if(chefEntries.length === 0){
      emptyNote.classList.remove('hidden');
    } else {
      chefEntries.forEach(h=>{
        const d = new Date(h.finishedAt);
        const day = d.getDate();
        const month = d.toLocaleDateString('he-IL', { month: 'short' });
        const timeStr = d.toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' });

        let badge;
        if(h.status === 'cancelled'){
          badge = '<span class="badge">בוטלה מוקדם</span>';
        } else if(h.overtimeSeconds > 0){
          const om = Math.floor(h.overtimeSeconds/60).toString().padStart(2,'0');
          const os = Math.floor(h.overtimeSeconds%60).toString().padStart(2,'0');
          badge = `<span class="badge badge-late"><span class="dot"></span>חריגה של <span dir="ltr">${om}:${os}</span></span>`;
        } else {
          badge = '<span class="badge badge-ok"><span class="dot"></span>חזר בזמן</span>';
        }

        const row = document.createElement('div');
        row.className = 'entry surface' + (h.status === 'cancelled' ? ' cancelled' : '');
        row.innerHTML = `
          <div class="entry-date"><div class="entry-day">${day}</div><div class="entry-month">${month}</div></div>
          <div class="entry-body">
            <div class="entry-title">הפסקה של ${h.minutes} דק'</div>
            ${badge}
          </div>
          <div class="entry-time">${timeStr}</div>
        `;
        entriesEl.appendChild(row);
      });
    }
  });
</script>

</body>
</html>
