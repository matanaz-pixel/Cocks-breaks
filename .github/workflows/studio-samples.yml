name: Shorts studio - render samples

# Renders a few stories with the production voice and publishes them, with the channel art,
# to the `shorts-samples` branch so they can be watched without setting anything up.
on:
  push:
    paths:
      - "shorts-engine/studio/**"
      - "shorts-engine/content/**"
      - ".github/workflows/studio-samples.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shorts-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter
          pip install -q -r requirements.txt
      - name: Render
        run: |
          python -m studio sample blockbuster-netflix bitcoin-pizza kodak-digital-camera
          python -m studio branding
      - name: Publish to the shorts-samples branch
        run: |
          mkdir -p /tmp/pub && cp -r out/* /tmp/pub/
          cd /tmp/pub
          git init -q -b shorts-samples
          git config user.name "shorts-studio-bot"
          git config user.email "shorts-studio-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Samples from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shorts-samples
