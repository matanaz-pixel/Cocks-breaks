name: Shorts studio - make daily video

on:
  schedule:
    - cron: "0 13 * * *"  # daily 13:00 UTC; the video waits in Telegram for approval
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to make"
        default: "1"

permissions:
  contents: write

concurrency:
  group: shorts-state
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shorts-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-inter
          pip install -q -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Top up story bank
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m studio ideas
      - name: Make and send for approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m studio make --count ${{ github.event.inputs.count || '1' }}
      - name: Keep the video for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: shorts-engine/out/*.mp4
          retention-days: 14
      - name: Save state
        run: |
          git config user.name "shorts-studio-bot"
          git config user.email "shorts-studio-bot@users.noreply.github.com"
          git add state content
          git commit -m "Studio: made video $(date -u +%F)" || exit 0
          git pull --rebase -q && git push
